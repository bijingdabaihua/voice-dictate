name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-app.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest
