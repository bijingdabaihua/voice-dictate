[project]
name = "dictate"
version = "0.1.0"
description = "Press-and-hold local dictation for macOS, powered by Qwen3-ASR + MLX"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "bijingdabaihua" }]
classifiers = [
    "Environment :: MacOS X",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "build", "dist", "models", "logs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
# 项目文档和注释使用中文全角标点，不按英文歧义字符提示。
ignore = ["RUF001", "RUF002", "RUF003"]
